specificationVersion: jobtemplate-2023-09
extensions:
  - REDACTED_ENV_VARS
  - TASK_CHUNKING
name: RenderJob
parameterDefinitions:
- name: ProjectFilePath
  type: PATH
  objectType: FILE
  dataFlow: IN
  userInterface: 
   control: HIDDEN
- name: ExtraCmdArgs
  type: STRING
  default: '-log'
  userInterface: 
   control: LINE_EDIT
- name: ExtraCmdArgsFile
  type: PATH
  objectType: FILE
  dataFlow: IN
  userInterface: 
   control: HIDDEN
- name: Executable
  type: STRING
  default: 'UnrealEditor-Cmd'
  userInterface: 
   control: HIDDEN
- name: Frames
  type: STRING
  default: '1-100'
  description: 'Frame range expression (e.g., "1-100", "1,3,5-10:2")'
  userInterface: 
   control: LINE_EDIT
- name: ChunkSize
  type: INT
  default: 1
  minValue: 1
  description: 'Number of tasks to divide the frame range into'
  userInterface:
   control: SPIN_BOX
- name: TargetRuntime
  type: INT
  default: 600
  minValue: 0
  description: 'Target runtime in seconds per task (hint for scheduler)'
  userInterface:
   control: SPIN_BOX
- name: RangeConstraint
  type: STRING
  default: 'NONCONTIGUOUS'
  description: 'Whether frames in a chunk must be contiguous or can be non-contiguous'
  userInterface:
   control: DROPDOWN_LIST
  allowedValues:
   - CONTIGUOUS
   - NONCONTIGUOUS
- name: CondaPackages
  type: STRING
  default: unrealengine=5.6 unrealengine-openjd=0.6.*
  userInterface: 
   control: LINE_EDIT
- name: CondaChannels
  type: STRING
  default: deadline-cloud
  userInterface: 
   control: LINE_EDIT
