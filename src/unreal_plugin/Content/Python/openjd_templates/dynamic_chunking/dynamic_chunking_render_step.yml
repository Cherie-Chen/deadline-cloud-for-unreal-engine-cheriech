name: Render
parameterSpace:
  taskParameterDefinitions:
  - name: Frame
    type: CHUNK[INT]
    range: "{{Param.Frames}}"
    chunks:
      defaultTaskCount: "{{Param.ChunkSize}}"
      targetRuntimeSeconds: "{{Param.TargetRuntime}}"
      rangeConstraint: "{{Param.RangeConstraint}}"
  - name: Handler
    type: STRING
    range: []
  - name: QueueManifestPath
    type: PATH
    range: []
script:
  embeddedFiles:
  - name: runData
    filename: run-data.yaml
    type: TEXT
    data: |
      handler: {{Task.Param.Handler}}
      queue_manifest_path: {{Task.Param.QueueManifestPath}}
      frame_chunk: {{Task.Param.Frame}}
  actions:
    onRun:
      command: unreal-engine-openjd
      args:
      - daemon
      - run
      - --connection-file
      - '{{Session.WorkingDirectory}}/connection.json'
      - --run-data
      - file://{{Task.File.runData}}
      cancelation:
        mode: NOTIFY_THEN_TERMINATE
